name: Resource Suggestion
description: Suggest a new Agentic AI resource, paper, tool, framework, guide, or glossary term.
title: "[Resource]: "
labels: ["resource-suggestion", "needs-review"]
body:
  - type: input
    id: resource-title
    attributes:
      label: Resource title
      placeholder: "Example: Agent Engineering Framework"
    validations:
      required: true

  - type: input
    id: resource-url
    attributes:
      label: Official URL
      description: Prefer the official source, publisher page, GitHub repo, paper page, or documentation page.
    validations:
      required: true

  - type: input
    id: publisher
    attributes:
      label: Author, organization, or publisher
    validations:
      required: true

  - type: dropdown
    id: resource-type
    attributes:
      label: Resource type
      options:
        - Article
        - Research paper
        - GitHub repository
        - Framework
        - Tool
        - Documentation
        - Course
        - Video
        - Glossary term
        - Dataset
        - Other
    validations:
      required: true

  - type: textarea
    id: suggested-category
    attributes:
      label: Suggested category or domain
      placeholder: "Example: Agentic Engineering, Architectures, Evaluation, Organizational Adoption"
    validations:
      required: false

  - type: textarea
    id: reason
    attributes:
      label: Why should this be included?
      description: Explain why this resource is useful, credible, or relevant.
    validations:
      required: true

  - type: dropdown
    id: access-type
    attributes:
      label: Access type
      options:
        - Free
        - Paid
        - Open source
        - Academic (freely accessible)
        - Requires registration
        - Unknown
    validations:
      required: false

  - type: checkboxes
    id: quality-check
    attributes:
      label: Before submitting
      options:
        - label: I checked that this resource is not already in the library at agenticlibrary.net.
          required: true
        - label: I have provided the official or most reliable URL I could find.
          required: true
        - label: I understand that not all suggestions will be added.
          required: true
